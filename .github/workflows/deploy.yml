name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve repo subpath
        id: subpath
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          echo "name=$REPO_NAME" >> "$GITHUB_OUTPUT"
          echo "Deploying to /$REPO_NAME/"

      - name: Sync products dataset into both apps
        run: node scripts/sync-data.mjs

      # ------------------ Internal app (B2B) ------------------
      - name: Install internal app deps
        working-directory: frontend
        run: |
          node -v
          npm -v
          ls -la
          npm install --no-audit --no-fund 2>&1 | tail -80

      - name: Build internal app
        working-directory: frontend
        env:
          VITE_STATIC_MODE: 'true'
          VITE_BASE_PATH: /${{ steps.subpath.outputs.name }}/internal/
          VITE_ELABEL_LANDING_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ steps.subpath.outputs.name }}/landing
          VITE_APP_NAME: 'Sữa Vina (demo)'
          VITE_API_BASE_URL: ''
        run: npm run build

      # ------------------ Landing page (B2C) ------------------
      - name: Install landing deps
        working-directory: landing
        run: npm install --no-audit --no-fund 2>&1 | tail -80

      - name: Build landing
        working-directory: landing
        env:
          VITE_STATIC_MODE: 'true'
          VITE_BASE_PATH: /${{ steps.subpath.outputs.name }}/landing/
          VITE_APP_NAME: 'Sữa Vina Landing (demo)'
          VITE_API_BASE_URL: ''
        run: npm run build

      # ------------------ Compose deploy dist ------------------
      - name: Compose deploy directory
        run: |
          mkdir -p dist/internal dist/landing
          cp -R frontend/dist/. dist/internal/
          cp -R landing/dist/. dist/landing/
          cp dist/internal/index.html dist/internal/404.html
          cp dist/landing/index.html dist/landing/404.html
          cp docs/site-index.html dist/index.html
          cp dist/landing/index.html dist/404.html
          ls -la dist/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
